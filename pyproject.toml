[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetpilot"
version = "0.1.0"
description = "Gestor de presupuestos TUI en terminal"
requires-python = ">=3.10"
dependencies = [
  "textual>=0.50",
  "rich>=13.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]